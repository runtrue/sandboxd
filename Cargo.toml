[workspace]
resolver = "2"
members = [
  "bins/sandbox-net-agent",
  "bins/sandbox-broker",
  "bins/sandbox-autoscaler",
  "bins/sandbox-gateway",
  "bins/sandboxctl",
  "bins/sandboxd",
  "crates/sandbox-core",
  "crates/sandbox-artifact",
  "crates/sandbox-gvisor",
  "crates/sandbox-oci",
  "crates/sandbox-placement",
  "crates/sandbox-protocol",
  "crates/sandbox-runtime",
  "crates/sandbox-volume",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
aes-gcm = { version = "=0.10.3", features = ["stream", "zeroize"] }
async-trait = "=0.1.91"
axum = "=0.8.9"
base64 = "=0.23.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
clap = { version = "=4.6.4", features = ["derive", "env"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
futures-util = "=0.3.33"
hex = "=0.4.3"
hmac = "=0.12.1"
hkdf = "=0.12.4"
k8s-openapi = { version = "=0.28.0", features = ["v1_36"] }
kube = { version = "=4.0.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
libc = "=0.2.189"
nix = { version = "=0.31.3", features = ["dir", "fs", "mount", "poll", "process", "socket", "user"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
s3-wire = "=0.1.0"
tempfile = "=3.27.0"
tar = "=0.4.46"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring"] }
tower = { version = "=0.5.3", features = ["limit", "util"] }
xattr = { version = "=1.6.1", default-features = false }
zstd = { version = "=0.13.3", default-features = false }
zeroize = "=1.9.0"
runtrue-sandbox-artifact = { version = "=0.1.0-alpha.1", path = "crates/sandbox-artifact" }
runtrue-sandbox-core = { version = "=0.1.0-alpha.1", path = "crates/sandbox-core" }
runtrue-sandbox-gvisor = { version = "=0.1.0-alpha.1", path = "crates/sandbox-gvisor" }
runtrue-sandbox-oci = { version = "=0.1.0-alpha.1", path = "crates/sandbox-oci" }
runtrue-sandbox-placement = { version = "=0.1.0-alpha.1", path = "crates/sandbox-placement" }
runtrue-sandbox-protocol = { version = "=0.1.0-alpha.1", path = "crates/sandbox-protocol" }
runtrue-sandbox-runtime = { version = "=0.1.0-alpha.1", path = "crates/sandbox-runtime" }
runtrue-sandbox-volume = { version = "=0.1.0-alpha.1", path = "crates/sandbox-volume" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
