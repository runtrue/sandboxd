[workspace]
resolver = "2"
members = [
  "bins/sandboxctl",
  "bins/sandboxd",
  "crates/sandbox-core",
  "crates/sandbox-artifact",
  "crates/sandbox-gvisor",
  "crates/sandbox-oci",
  "crates/sandbox-runtime",
  "crates/sandbox-volume",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
aes-gcm = { version = "=0.10.3", features = ["stream", "zeroize"] }
async-trait = "=0.1.91"
base64 = "=0.22.1"
clap = { version = "=4.5.4", features = ["derive"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
hex = "=0.4.3"
hmac = "=0.12.1"
hkdf = "=0.12.4"
libc = "=0.2.186"
nix = { version = "=0.31.3", features = ["dir", "fs", "mount", "poll", "socket", "user"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
s3-wire = "=0.1.0"
tempfile = "=3.27.0"
tar = "=0.4.46"
thiserror = "=1.0.61"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
xattr = { version = "=1.6.1", default-features = false }
zstd = { version = "=0.13.3", default-features = false }
zeroize = "=1.9.0"
runtrue-sandbox-artifact = { version = "=0.1.0", path = "crates/sandbox-artifact" }
runtrue-sandbox-core = { version = "=0.1.0", path = "crates/sandbox-core" }
runtrue-sandbox-gvisor = { version = "=0.1.0", path = "crates/sandbox-gvisor" }
runtrue-sandbox-oci = { version = "=0.1.0", path = "crates/sandbox-oci" }
runtrue-sandbox-runtime = { version = "=0.1.0", path = "crates/sandbox-runtime" }
runtrue-sandbox-volume = { version = "=0.1.0", path = "crates/sandbox-volume" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
