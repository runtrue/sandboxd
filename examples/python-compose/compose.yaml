name: sandbox-network-example

networks:
  application:
    internal: true
    driver: bridge

volumes:
  fixture:
    persistence_class: artifact
    content_digest: sha256:507aa5df7f283c70ea39528e7d0a27f2e29a7c685d9e0f360a89169d68713b64

services:
  server:
    image: docker.io/library/python:3.13-slim
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        import http.server, json, os
        class Handler(http.server.BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"
            def do_GET(self):
                body = json.dumps({"ok": True, "service": "server", "request_path": self.path, "topology": os.environ["TOPOLOGY_NAME"]}, sort_keys=True).encode()
                self.send_response(200)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *_):
                pass
        http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TOPOLOGY_NAME: sandbox-network-example
    networks: [application]
    healthcheck:
      test: [CMD, /usr/local/bin/python3, -c, 'import socket; socket.create_connection(("127.0.0.1", 8080), timeout=0.5).close()']
      interval_ms: 50
      timeout_ms: 500
      retries: 40
    read_only: true

  client:
    image: docker.io/library/python:3.13-slim
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        import json, pathlib, urllib.request
        assert pathlib.Path("/etc/debian_version").read_text() == "artifact-volume-e2e\n"
        with urllib.request.urlopen("http://server:8080/from-client", timeout=2) as response:
            payload = json.load(response)
        assert payload == {"ok": True, "request_path": "/from-client", "service": "server", "topology": "sandbox-network-example"}
        print(json.dumps({"client": "passed", "response": payload}, sort_keys=True))
    depends_on:
      server:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TOPOLOGY_NAME: sandbox-network-example
    networks: [application]
    volumes:
      - source: fixture
        target: /etc/debian_version
    read_only: true
