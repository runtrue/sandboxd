name: sandbox-memory-limit

services:
  memory:
    image: docker.io/library/python:3.13-slim
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        import time
        allocation = bytearray(256 * 1024 * 1024)
        allocation[0] = 1
        print("memory limit failed", flush=True)
        time.sleep(5)
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
