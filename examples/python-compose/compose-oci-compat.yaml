name: sandbox-oci-compatibility
x-runtrue-guest-profile: oci-compat-v1

services:
  capability-fixture:
    image: docker.io/library/python:3.13-slim
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        import os, socket, stat

        def status(name):
            with open("/proc/self/status", encoding="ascii") as stream:
                fields = dict(line.rstrip().split(":\t", 1) for line in stream if ":\t" in line)
            return fields[name]

        enabled = {0, 1, 3, 4, 6, 7}
        expected = sum(1 << capability for capability in enabled)
        assert os.getuid() == 0 and os.getgid() == 0
        assert int(status("CapBnd"), 16) == expected
        assert int(status("CapEff"), 16) == expected
        assert int(status("CapPrm"), 16) == expected
        assert int(status("CapInh"), 16) == 0
        assert int(status("CapAmb"), 16) == 0
        assert status("NoNewPrivs") == "1"

        chown_target = "/tmp/cap-chown"
        with open(chown_target, "w", encoding="ascii") as stream:
            stream.write("owned")
        os.chown(chown_target, 1234, 1234)
        assert os.stat(chown_target).st_uid == 1234

        dac_target = "/tmp/cap-dac-override"
        with open(dac_target, "w", encoding="ascii") as stream:
            stream.write("readable")
        os.chmod(dac_target, 0)
        with open(dac_target, encoding="ascii") as stream:
            assert stream.read() == "readable"

        os.chmod(chown_target, 0o600)
        assert stat.S_IMODE(os.stat(chown_target).st_mode) == 0o600

        fsetid_target = "/tmp/cap-fsetid"
        with open(fsetid_target, "w", encoding="ascii") as stream:
            stream.write("before")
        os.chown(fsetid_target, 1234, 1234)
        os.chmod(fsetid_target, 0o2640)
        with open(fsetid_target, "a", encoding="ascii") as stream:
            stream.write("after")
        assert os.stat(fsetid_target).st_mode & stat.S_ISGID

        try:
            socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_ICMP)
            raise AssertionError("CAP_NET_RAW unexpectedly available")
        except PermissionError:
            pass
        for protected in ["/proc/kcore", "/proc/sys/kernel/hostname"]:
            try:
                os.open(protected, os.O_RDWR)
                raise AssertionError(f"sensitive path unexpectedly writable: {protected}")
            except OSError:
                pass

        os.setgroups([1234])
        os.setgid(1234)
        assert os.getgid() == 1234
        os.setuid(1234)
        assert os.getuid() == 1234
        print("OCI compatibility capability fixture passed")
    read_only: true
