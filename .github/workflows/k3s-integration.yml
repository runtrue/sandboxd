name: K3s integration

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/k3s-integration.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bins/**"
      - "crates/**"
      - "deploy/k3s/**"
      - "tools/test-k3s-fixed-runtime.sh"
      - "tools/test-k3s-resource-limits.sh"
      - "tools/test-k3s-brokered-runtime.sh"
      - "tools/test-k3s-autoscaling.sh"
      - "tools/test-k3s-image-preparation.sh"
      - "tools/test-k3s-userspace-egress.sh"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/k3s-integration.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bins/**"
      - "crates/**"
      - "deploy/k3s/**"
      - "tools/test-k3s-fixed-runtime.sh"
      - "tools/test-k3s-resource-limits.sh"
      - "tools/test-k3s-brokered-runtime.sh"
      - "tools/test-k3s-autoscaling.sh"
      - "tools/test-k3s-image-preparation.sh"
      - "tools/test-k3s-userspace-egress.sh"
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k3s-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  K3S_VERSION: v1.36.1+k3s1
  K3S_AMD64_SHA256: a443db3fe9820cd93617ae67e4386d87c1514c1e96ceb30f4c2791c39065653c

jobs:
  fixed-runtime:
    name: Fixed runtime in local-only k3s
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ephemeral runner
        run: |
          sudo -n true
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          test "$(uname -m)" = x86_64
          command -v curl
          command -v docker
          command -v iptables-save
          command -v jq
          command -v systemd-run

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Build fixed-runtime image
        run: |
          build_id=$(sha256sum target/release/runtrue-sandboxd | cut -d' ' -f1)
          docker build \
            --build-arg "SANDBOXD_BUILD_ID=$build_id" \
            --tag sandboxd-fixed-runtime:local \
            --file deploy/k3s/Dockerfile.fixed-runtime \
            .

      - name: Build isolated image-preparer image
        run: |
          build_id=$(sha256sum target/release/runtrue-sandboxctl | cut -d' ' -f1)
          docker build \
            --build-arg "SANDBOXD_BUILD_ID=$build_id" \
            --tag sandbox-image-preparer:local \
            --file deploy/k3s/Dockerfile.preparer \
            .

      - name: Build control-plane images
        run: |
          build_id=$(git rev-parse HEAD)
          docker build \
            --build-arg "SANDBOXD_BUILD_ID=$build_id" \
            --tag sandbox-gateway:local \
            --file deploy/k3s/Dockerfile.gateway \
            .
          docker build \
            --build-arg "SANDBOXD_BUILD_ID=$build_id" \
            --tag sandbox-broker:local \
            --file deploy/k3s/Dockerfile.broker \
            .
          docker build \
            --build-arg "SANDBOXD_BUILD_ID=$build_id" \
            --tag sandbox-autoscaler:local \
            --file deploy/k3s/Dockerfile.autoscaler \
            .
          docker pull postgres:17.5-alpine@sha256:ec68817297c5984a00c85c9e3bbd88079d0217284f1a3f0525603a6f9b883916
          docker tag \
            postgres@sha256:ec68817297c5984a00c85c9e3bbd88079d0217284f1a3f0525603a6f9b883916 \
            postgres:17.5-alpine

      - name: Install checksum-pinned k3s
        run: |
          encoded_version=${K3S_VERSION//+/%2B}
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output /tmp/k3s \
            "https://github.com/k3s-io/k3s/releases/download/${encoded_version}/k3s"
          echo "${K3S_AMD64_SHA256}  /tmp/k3s" | sha256sum --check --strict
          sudo install -m 0755 /tmp/k3s /usr/local/bin/k3s
          sudo ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl

      - name: Start local-only k3s
        run: |
          node_ip=$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<=NF; i++) if ($i == "src") {print $(i+1); exit}}')
          test -n "$node_ip"
          sudo install -d -m 0755 /etc/rancher/k3s
          sudo tee /etc/rancher/k3s/config.yaml >/dev/null <<EOF
          bind-address: 127.0.0.1
          advertise-address: 127.0.0.1
          node-ip: ${node_ip}
          tls-san:
            - 127.0.0.1
          write-kubeconfig-mode: "0600"
          disable:
            - traefik
            - servicelb
            - metrics-server
            - local-storage
          kubelet-arg:
            - pod-max-pids=256
          kube-controller-manager-arg:
            - terminated-pod-gc-threshold=32
          disable-network-policy: false
          EOF
          sudo chmod 0600 /etc/rancher/k3s/config.yaml
          sudo systemd-run \
            --unit=sandboxd-ci-k3s \
            --property=Type=exec \
            --collect \
            /usr/local/bin/k3s server --config /etc/rancher/k3s/config.yaml
          node=""
          for _ in $(seq 1 180); do
            node=$(
              sudo /usr/local/bin/k3s kubectl get node \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true
            )
            if [[ -n "$node" ]]; then
              break
            fi
            sleep 1
          done
          test -n "$node"
          sudo /usr/local/bin/k3s kubectl wait \
            --for=condition=Ready "node/${node}" --timeout=180s
          sudo install \
            -m 0600 \
            -o "$(id -u)" \
            -g "$(id -g)" \
            /etc/rancher/k3s/k3s.yaml \
            /tmp/sandboxd-k3s.yaml
          echo "KUBECONFIG=/tmp/sandboxd-k3s.yaml" >>"$GITHUB_ENV"

      - name: Validate local control-plane boundary
        run: |
          sudo ss -H -lntp \
            | awk '$4 == "127.0.0.1:6443" { found=1 } END { exit !found }'
          sudo ss -H -lntp \
            | awk '$4 == "127.0.0.1:10250" { found=1 } END { exit !found }'
          node=$(kubectl get node -o jsonpath='{.items[0].metadata.name}')
          kubectl label node "$node" runtrue.io/sandbox-node=true --overwrite

      - name: Import integration images
        run: |
          docker save \
            sandboxd-fixed-runtime:local \
            sandbox-image-preparer:local \
            sandbox-gateway:local \
            sandbox-broker:local \
            sandbox-autoscaler:local \
            postgres:17.5-alpine \
            | sudo /usr/local/bin/k3s ctr images import -

      - name: Run k3s fixed-runtime conformance
        run: |
          mkdir -p k3s-diagnostics
          bash tools/test-k3s-fixed-runtime.sh \
            | tee k3s-diagnostics/conformance.log

      - name: Run attested image-preparation conformance
        run: |
          bash tools/test-k3s-image-preparation.sh \
            | tee k3s-diagnostics/image-preparation.log

      - name: Run capability-free userspace egress conformance
        run: |
          bash tools/test-k3s-userspace-egress.sh \
            | tee k3s-diagnostics/userspace-egress.log

      - name: Run k3s resource-boundary conformance
        run: |
          bash tools/test-k3s-resource-limits.sh \
            | tee k3s-diagnostics/resource-limits.log

      - name: Run brokered control-plane conformance
        run: |
          bash tools/test-k3s-brokered-runtime.sh \
            | tee k3s-diagnostics/brokered-runtime.log

      - name: Run warm-pool autoscaling conformance
        env:
          AUTOSCALE_DIAGNOSTICS_DIR: k3s-diagnostics
        run: |
          bash tools/test-k3s-autoscaling.sh \
            | tee k3s-diagnostics/autoscaling.log

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p k3s-diagnostics
          kubectl get \
            namespace,serviceaccount,role,rolebinding,deployment,statefulset,replicaset,pod,networkpolicy,service,ingress \
            --all-namespaces \
            -o wide >k3s-diagnostics/resources.txt 2>&1 || true
          kubectl describe namespace sandboxd-system \
            >k3s-diagnostics/namespace.txt 2>&1 || true
          kubectl describe pod -n sandboxd-system \
            >k3s-diagnostics/pods.txt 2>&1 || true
          kubectl logs -n sandboxd-system \
            -l app.kubernetes.io/name=sandboxd-fixed-runtime \
            --all-containers \
            --prefix >k3s-diagnostics/sandboxd.log 2>&1 || true
          kubectl logs -n sandboxd-system \
            -l app.kubernetes.io/name=sandboxd-userspace-runtime \
            --all-containers \
            --prefix >k3s-diagnostics/userspace-worker.log 2>&1 || true
          kubectl logs -n sandboxd-system \
            -l app.kubernetes.io/name=sandboxd-fixed-runtime-brokered \
            --all-containers \
            --prefix >k3s-diagnostics/brokered-worker.log 2>&1 || true
          kubectl logs -n sandboxd-system \
            -l app.kubernetes.io/name=sandbox-image-preparer \
            --all-containers \
            --prefix >k3s-diagnostics/image-preparer.log 2>&1 || true
          kubectl logs -n sandboxd-system \
            -l app.kubernetes.io/name=sandbox-gateway \
            --all-containers \
            --prefix >k3s-diagnostics/gateway.log 2>&1 || true
          sudo journalctl -u sandboxd-ci-k3s.service --no-pager 2>&1 \
            | tee k3s-diagnostics/k3s.log >/dev/null || true
          sudo iptables-save 2>&1 \
            | tee k3s-diagnostics/iptables.txt >/dev/null || true
          sudo ss -lntp 2>&1 \
            | tee k3s-diagnostics/listeners.txt >/dev/null || true
          docker image inspect \
            sandboxd-fixed-runtime:local sandbox-gateway:local sandbox-broker:local \
            sandbox-autoscaler:local \
            >k3s-diagnostics/image.json 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k3s-integration-${{ github.run_id }}
          path: k3s-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Stop k3s
        if: always()
        run: |
          kubectl delete namespace sandboxd-system --wait=false >/dev/null 2>&1 || true
          sudo systemctl stop sandboxd-ci-k3s.service >/dev/null 2>&1 || true
