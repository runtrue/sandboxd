name: gVisor integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gvisor-integration
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  integration:
    name: Privileged lifecycle and snapshot tests
    runs-on: [self-hosted, linux, x64, sandboxd-gvisor]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate dedicated worker
        run: |
          test "$(id -u)" -eq 0
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          command -v cargo
          command -v ctr
          command -v ip
          command -v runsc
          test -S /run/containerd/containerd.sock
          ctr version >/dev/null
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Test lifecycle, networking, and resource limits
        run: ./examples/python-compose/run-local.sh
      - name: Test snapshot and restore
        run: ./examples/python-compose/run-snapshot-local.sh
