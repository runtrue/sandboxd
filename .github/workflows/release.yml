name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.97.1
      - name: Install dependency scanners
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit,cargo-deny
      - name: Validate source and dependency policy
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          ./tools/test-s3-artifacts.sh
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo audit --deny warnings
          cargo deny check advisories licenses bans sources

  publish:
    name: Publish x86-64 Linux binaries
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-unknown-linux-musl --no-self-update
          rustup default 1.97.1
      - name: Build release binaries twice
        run: |
          cargo build --workspace --release --locked
          cargo build \
            --release \
            --locked \
            --package runtrue-sandbox-net-agent \
            --target x86_64-unknown-linux-musl
          sha256sum \
            target/release/runtrue-sandboxctl \
            target/release/runtrue-sandboxd \
            target/release/runtrue-sandbox-gateway \
            target/release/runtrue-sandbox-broker \
            target/x86_64-unknown-linux-musl/release/runtrue-sandbox-net-agent \
            > /tmp/first-build.sha256
          mkdir -p /tmp/first-build
          cp \
            target/release/runtrue-sandboxctl \
            target/release/runtrue-sandboxd \
            target/release/runtrue-sandbox-gateway \
            target/release/runtrue-sandbox-broker \
            /tmp/first-build/
          cp \
            target/x86_64-unknown-linux-musl/release/runtrue-sandbox-net-agent \
            /tmp/first-build/
          cargo clean
          cargo build --workspace --release --locked
          cargo build \
            --release \
            --locked \
            --package runtrue-sandbox-net-agent \
            --target x86_64-unknown-linux-musl
          sha256sum \
            target/release/runtrue-sandboxctl \
            target/release/runtrue-sandboxd \
            target/release/runtrue-sandbox-gateway \
            target/release/runtrue-sandbox-broker \
            target/x86_64-unknown-linux-musl/release/runtrue-sandbox-net-agent \
            > /tmp/second-build.sha256
          diff --unified /tmp/first-build.sha256 /tmp/second-build.sha256
      - name: Create deterministic archive and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="sandboxd-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          install -m 0755 /tmp/first-build/runtrue-sandboxctl "dist/${package}/"
          install -m 0755 /tmp/first-build/runtrue-sandboxd "dist/${package}/"
          install -m 0755 /tmp/first-build/runtrue-sandbox-gateway "dist/${package}/"
          install -m 0755 /tmp/first-build/runtrue-sandbox-broker "dist/${package}/"
          install -m 0755 /tmp/first-build/runtrue-sandbox-net-agent "dist/${package}/"
          install -m 0644 README.md SECURITY.md LICENSE "dist/${package}/"
          commit_time="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@${commit_time}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "dist/${package}.tar.gz" \
            "${package}"
          (
            cd dist
            sha256sum "${package}.tar.gz" > SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$RELEASE_TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "sandboxd ${RELEASE_TAG}" \
            --generate-notes \
            "${prerelease[@]}"
