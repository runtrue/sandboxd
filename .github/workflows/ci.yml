name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SANDBOX_PLACEMENT_POSTGRES_URL: postgres://sandboxd:sandboxd@127.0.0.1:5432/sandboxd_placement_test
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:ec68817297c5984a00c85c9e3bbd88079d0217284f1a3f0525603a6f9b883916
        env:
          POSTGRES_USER: sandboxd
          POSTGRES_PASSWORD: sandboxd
          POSTGRES_DB: sandboxd_placement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandboxd -d sandboxd_placement_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.97.1
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run cross-worker S3 artifact test
        run: ./tools/test-s3-artifacts.sh
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Validate shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: Validate performance harness
        run: |
          python3 -m unittest discover -s tools/performance/tests
          shellcheck tools/performance/run-control-plane.sh
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  security:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Install dependency scanners
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit RustSec advisories
        run: cargo audit --deny warnings
      - name: Enforce dependency policy
        run: cargo deny check advisories licenses bans sources

  reproducible-build:
    name: Same-run reproducible release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Build release binaries
        run: |
          cargo build --workspace --release --locked
          sha256sum target/release/runtrue-sandboxctl target/release/runtrue-sandboxd target/release/runtrue-sandbox-gateway target/release/runtrue-sandbox-broker > /tmp/sandboxd-first-build.sha256
      - name: Rebuild from clean outputs
        run: |
          cargo clean
          cargo build --workspace --release --locked
          sha256sum target/release/runtrue-sandboxctl target/release/runtrue-sandboxd target/release/runtrue-sandbox-gateway target/release/runtrue-sandbox-broker > /tmp/sandboxd-second-build.sha256
          diff --unified /tmp/sandboxd-first-build.sha256 /tmp/sandboxd-second-build.sha256
