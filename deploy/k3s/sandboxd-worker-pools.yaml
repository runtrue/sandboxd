              lifecycle:
                preStop:
                  exec:
                    command:
                      - /usr/local/bin/runtrue-sandboxd
                      - shutdown
                      - --socket
                      - /run/runtrue-sandboxd-operator/control.sock
              volumeMounts:
                - name: sandboxd-tmp
                  mountPath: /tmp
                - name: sandboxd-runtime
                  mountPath: /run/runtrue-sandboxd
                - name: sandboxd-operator-runtime
                  mountPath: /run/runtrue-sandboxd-operator
                - name: sandboxd-state
                  mountPath: /var/lib/runtrue-sandboxd
                - name: work-order-key
                  mountPath: /run/secrets/work-order/key
                  subPath: key
                  readOnly: true
