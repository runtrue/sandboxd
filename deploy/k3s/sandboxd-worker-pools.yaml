apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: sandboxd-worker-pools
      namespace: sandboxd-system
    spec:
      clusterIP: None
      selector:
        runtrue.io/autoscaled-worker: "true"
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: sandboxd-worker-pools-default-deny
      namespace: sandboxd-system
    spec:
      podSelector:
        matchLabels:
          runtrue.io/autoscaled-worker: "true"
      policyTypes: [Ingress, Egress]
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: sandboxd-worker-pools-control-plane
      namespace: sandboxd-system
    spec:
      podSelector:
        matchLabels:
          runtrue.io/autoscaled-worker: "true"
      policyTypes: [Ingress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: sandbox-gateway
          ports:
            - protocol: TCP
              port: 8081
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: sandboxd-userspace-ingress-egress
      namespace: sandboxd-system
    spec:
      podSelector:
        matchLabels:
          runtrue.io/worker-pool: userspace-ingress
      policyTypes: [Egress]
      egress:
        - ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - ports:
            - protocol: TCP
              port: 443
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: sandboxd-fixed-standard-warm
      namespace: sandboxd-system
      labels:
        runtrue.io/worker-pool: fixed-standard-warm
    spec: &worker_stateful_set
      serviceName: sandboxd-worker-pools
      replicas: 0
      podManagementPolicy: Parallel
      revisionHistoryLimit: 2
      selector:
        matchLabels:
          runtrue.io/worker-pool: fixed-standard-warm
      template:
        metadata:
          labels:
            runtrue.io/autoscaled-worker: "true"
            runtrue.io/worker-pool: fixed-standard-warm
            runtrue.io/resource-shape: standard-v1
            runtrue.io/worker-broker: "true"
        spec: &fixed_worker_pod
          hostUsers: false
          restartPolicy: Always
          nodeSelector:
            runtrue.io/sandbox-node: "true"
          tolerations:
            - key: runtrue.io/sandbox
              operator: Equal
              value: "true"
              effect: NoSchedule
          serviceAccountName: sandboxd-brokered
          automountServiceAccountToken: false
          enableServiceLinks: false
          dnsPolicy: ClusterFirst
          terminationGracePeriodSeconds: 30
          securityContext:
            fsGroup: 65533
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: broker
              restartPolicy: Always
              image: sandbox-broker:local
              imagePullPolicy: Never
              args:
                - --listen
                - 0.0.0.0:8081
                - --allow-non-loopback-http
                - --workload-socket
                - /run/runtrue-sandboxd/workload.sock
              ports:
                - name: broker
                  containerPort: 8081
                  protocol: TCP
              securityContext:
                runAsNonRoot: true
                runAsUser: 65533
                runAsGroup: 65533
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
                appArmorProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
              readinessProbe:
                httpGet:
                  path: /health/ready
                  port: broker
                periodSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health/live
                  port: broker
                periodSeconds: 10
              volumeMounts:
                - name: sandboxd-runtime
                  mountPath: /run/runtrue-sandboxd
          containers:
            - name: sandboxd
              restartPolicy: Never
              image: sandboxd-fixed-runtime:local
              imagePullPolicy: Never
              command: [/usr/local/bin/runtrue-sandboxd]
              args:
                - serve
                - --worker-pod-uid-env
                - POD_UID
                - --resource-shape
                - standard-v1
                - --sandbox-cpu-millis
                - "1000"
                - --sandbox-memory-bytes
                - "1073741824"
                - --sandbox-pids
                - "256"
                - --sandbox-ephemeral-storage-bytes
                - "2147483648"
                - --maximum-services
                - "8"
                - --socket
                - /run/runtrue-sandboxd-operator/control.sock
                - --workload-socket
                - /run/runtrue-sandboxd/workload.sock
                - --broker-uid
                - "65533"
                - --broker-gid
                - "65533"
                - --work-order-key
                - /run/secrets/work-order/key
                - --state-root
                - /var/lib/runtrue-sandboxd/state
                - --image-store
                - /var/lib/runtrue-sandboxd/images
                - --fixed-rootfs
                - /opt/runtrue-sandboxd/fixed-rootfs
                - --fixed-topology-lock
                - /opt/runtrue-sandboxd/fixed-runtime.lock.json
                - --fixed-rootfs-digest
                - sha256:c73e49867e5b68681c2222e1e7b60aca9218d5a83ded507226f89438cea40db1
                - --fixed-rootfs-entries
                - "5621"
                - --fixed-rootfs-bytes
                - "118293769"
                - --network-mode
                - loopback
                - --cgroup-mode
                - external
                - --runsc
                - /usr/local/bin/runsc
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              securityContext:
                privileged: false
                allowPrivilegeEscalation: true
                readOnlyRootFilesystem: true
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  drop: [ALL]
                  add: [SETGID, SETUID, SYS_ADMIN, SYS_CHROOT]
                seccompProfile:
                  type: Unconfined
                appArmorProfile:
                  type: Unconfined
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 128Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 4Gi
              readinessProbe:
                exec:
                  command:
                    - /usr/local/bin/runtrue-sandboxd
                    - ready
                    - --socket
                    - /run/runtrue-sandboxd-operator/control.sock
                periodSeconds: 5
              startupProbe:
                exec:
                  command:
                    - /usr/local/bin/runtrue-sandboxd
                    - ping
                    - --socket
                    - /run/runtrue-sandboxd-operator/control.sock
                periodSeconds: 2
                failureThreshold: 90
              livenessProbe:
                exec:
                  command:
                    - /usr/local/bin/runtrue-sandboxd
                    - ping
                    - --socket
                    - /run/runtrue-sandboxd-operator/control.sock
                initialDelaySeconds: 15
                periodSeconds: 10
              lifecycle:
                preStop:
                  exec:
                    command:
                      - /usr/local/bin/runtrue-sandboxd
                      - shutdown
                      - --socket
                      - /run/runtrue-sandboxd-operator/control.sock
              volumeMounts:
                - name: sandboxd-tmp
                  mountPath: /tmp
                - name: sandboxd-runtime
                  mountPath: /run/runtrue-sandboxd
                - name: sandboxd-operator-runtime
                  mountPath: /run/runtrue-sandboxd-operator
                - name: sandboxd-state
                  mountPath: /var/lib/runtrue-sandboxd
                - name: work-order-key
                  mountPath: /run/secrets/work-order/key
                  subPath: key
                  readOnly: true
          volumes:
            - name: sandboxd-tmp
              emptyDir:
                sizeLimit: 512Mi
            - name: sandboxd-runtime
              emptyDir:
                sizeLimit: 64Mi
            - name: sandboxd-operator-runtime
              emptyDir:
                sizeLimit: 16Mi
            - name: sandboxd-state
              emptyDir:
                sizeLimit: 4Gi
            - name: work-order-key
              secret:
                secretName: sandbox-work-order
                defaultMode: 0440
