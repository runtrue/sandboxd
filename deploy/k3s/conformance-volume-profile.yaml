name: volume-profile-conformance

volumes:
  shared:
    persistence_class: persistent
    snapshot_policy: required
    quota_bytes: 8388608

services:
  writer:
    image: mirror.gcr.io/library/python@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        import time
        from pathlib import Path
        Path("/mnt/profile.txt").write_text("profile-volume-passed\n")
        time.sleep(300)
    healthcheck:
      test: [CMD, /usr/local/bin/python3, -c, 'from pathlib import Path; assert Path("/mnt/profile.txt").read_text() == "profile-volume-passed\n"']
      interval_ms: 50
      timeout_ms: 500
      retries: 80
    volumes:
      - source: shared
        target: /mnt
    read_only: true
