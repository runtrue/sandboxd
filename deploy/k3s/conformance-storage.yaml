name: fixed-storage-conformance

services:
  stress:
    image: mirror.gcr.io/library/python:3.13-slim
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        import errno, json
        written = 0
        try:
            with open("/tmp/exhaustion", "wb", buffering=0) as output:
                chunk = b"x" * (1024 * 1024)
                while True:
                    output.write(chunk)
                    written += len(chunk)
        except OSError as error:
            assert error.errno == errno.ENOSPC
            print(json.dumps({
                "marker": "storage-ceiling-passed",
                "written": written,
                "errno": error.errno
            }), flush=True)
    read_only: true
