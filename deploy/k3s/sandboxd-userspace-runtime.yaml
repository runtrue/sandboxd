apiVersion: v1
kind: Namespace
metadata:
  name: sandboxd-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandboxd
  namespace: sandboxd-system
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxd-default-deny
  namespace: sandboxd-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxd-userspace-egress
  namespace: sandboxd-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-userspace-runtime
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-userspace-runtime
  namespace: sandboxd-system
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-userspace-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxd-userspace-runtime
        runtrue.io/network-tier: userspace-ingress
        runtrue.io/resource-shape: standard-v1
    spec:
      hostUsers: false
      restartPolicy: Always
      nodeSelector:
        runtrue.io/sandbox-node: "true"
      tolerations:
        - key: runtrue.io/sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
      serviceAccountName: sandboxd
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: Default
      terminationGracePeriodSeconds: 30
      containers:
        - name: sandboxd
          restartPolicy: Never
          image: sandboxd-fixed-runtime:local
          imagePullPolicy: Never
          command:
            - /usr/local/bin/runtrue-sandboxd
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - serve
            - --minimum-clean-age-milliseconds
            - "1000"
            - --worker-id
            - worker-$(POD_UID)
            - --resource-shape
            - standard-v1
            - --sandbox-cpu-millis
            - "1000"
            - --sandbox-memory-bytes
            - "1073741824"
            - --sandbox-pids
            - "256"
            - --sandbox-ephemeral-storage-bytes
            - "2147483648"
            - --maximum-services
            - "8"
            - --socket
            - /run/runtrue-sandboxd/control.sock
            - --state-root
            - /var/lib/runtrue-sandboxd/state
            - --image-store
            - /var/lib/runtrue-sandboxd/images
            - --fixed-rootfs
            - /opt/runtrue-sandboxd/fixed-rootfs
            - --fixed-topology-lock
            - /opt/runtrue-sandboxd/fixed-runtime.lock.json
            - --fixed-rootfs-digest
            - sha256:c73e49867e5b68681c2222e1e7b60aca9218d5a83ded507226f89438cea40db1
            - --fixed-rootfs-entries
            - "5621"
            - --fixed-rootfs-bytes
            - "118293769"
            - --network-mode
            - userspace
            - --cgroup-mode
            - external
            - --runsc
            - /usr/local/bin/runsc
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add:
                - SETGID
                - SETUID
                - SYS_ADMIN
                - SYS_CHROOT
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/runtrue-sandboxd
                - ready
                - --socket
                - /run/runtrue-sandboxd/control.sock
            periodSeconds: 1
          startupProbe:
            exec:
              command:
                - /usr/local/bin/runtrue-sandboxd
                - ping
                - --socket
                - /run/runtrue-sandboxd/control.sock
            periodSeconds: 2
            failureThreshold: 90
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/local/bin/runtrue-sandboxd
                  - shutdown
                  - --socket
                  - /run/runtrue-sandboxd/control.sock
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/runtrue-sandboxd
                - ping
                - --socket
                - /run/runtrue-sandboxd/control.sock
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: sandboxd-tmp
              mountPath: /tmp
            - name: sandboxd-runtime
              mountPath: /run/runtrue-sandboxd
            - name: sandboxd-state
              mountPath: /var/lib/runtrue-sandboxd
      volumes:
        - name: sandboxd-tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: sandboxd-runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: sandboxd-state
          emptyDir:
            sizeLimit: 4Gi
