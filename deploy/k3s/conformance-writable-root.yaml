name: writable-root-conformance

services:
  writer:
    image: mirror.gcr.io/library/python:3.13-slim
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        from pathlib import Path
        import time
        Path("/var/tmp/result.txt").write_text("writable-root-passed\n")
        print(Path("/var/tmp/result.txt").read_text(), end="", flush=True)
        time.sleep(300)
    read_only: false
