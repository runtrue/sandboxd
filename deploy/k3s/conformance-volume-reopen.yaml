name: volume-reopen-conformance

volumes:
  shared:
    persistence_class: persistent
    snapshot_policy: required
    quota_bytes: 8388608

services:
  reader:
    image: mirror.gcr.io/library/python@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        from pathlib import Path
        value = Path("/mnt/conformance.txt").read_text()
        assert value == "named-volume-passed\n"
        print(value, end="")
    volumes:
      - source: shared
        target: /mnt
    read_only: true
