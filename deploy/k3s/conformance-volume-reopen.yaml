name: volume-reopen-conformance

volumes:
  shared:
    persistence_class: persistent
    snapshot_policy: required
    quota_bytes: 8388608

services:
  reader:
    image: mirror.gcr.io/library/python@sha256:afe189875f1d2f9b45e287834fb9f2c273a5d59d354ae4050ab9affbf0a6ba06
    entrypoint: [/usr/local/bin/python3, -c]
    command:
      - |
        from pathlib import Path
        value = Path("/mnt/conformance.txt").read_text()
        assert value == "named-volume-passed\n"
        print(value, end="")
    volumes:
      - source: shared
        target: /mnt
    read_only: true
