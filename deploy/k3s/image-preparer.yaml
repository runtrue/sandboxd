apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-image-preparer
  namespace: sandboxd-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-preparation-cache
  namespace: sandboxd-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-image-preparer
  namespace: sandboxd-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-image-preparer
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-image-preparer
  namespace: sandboxd-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-image-preparer
    spec:
      hostUsers: false
      restartPolicy: Never
      serviceAccountName: sandbox-image-preparer
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: Default
      containers:
        - name: preparer
          image: sandbox-image-preparer:local
          imagePullPolicy: Never
          env:
            - name: RUNTRUE_PREPARATION_REFERENCE
              value: mirror.gcr.io/library/python:3.13-slim
            - name: RUNTRUE_PREPARATION_KEY_ID
              value: local-preparer
            - name: RUNTRUE_PREPARATION_POLICY
              value: strict-v1
            - name: RUNTRUE_PREPARATION_TOOLCHAIN_DIGEST
              value: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            - name: RUNTRUE_VULNERABILITY_POLICY
              value: release-v1
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SYS_ADMIN]
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: workspace
              mountPath: /workspace
            - name: containerd-runtime
              mountPath: /run/containerd
            - name: signing
              mountPath: /run/secrets/signing
              readOnly: true
            - name: registry
              mountPath: /run/secrets/registry
              readOnly: true
            - name: evidence
              mountPath: /run/evidence
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: sandbox-preparation-cache
        - name: workspace
          emptyDir:
            sizeLimit: 4Gi
        - name: containerd-runtime
          emptyDir:
            sizeLimit: 128Mi
        - name: signing
          secret:
            secretName: sandbox-image-preparer-signing
            defaultMode: 0400
        - name: registry
          secret:
            secretName: sandbox-image-preparer-registry
            optional: true
            defaultMode: 0400
        - name: evidence
          configMap:
            name: sandbox-image-preparer-evidence
