apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-gateway
  namespace: sandboxd-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-gateway
  namespace: sandboxd-system
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-gateway
        app.kubernetes.io/part-of: sandbox-gateway
    spec:
      serviceAccountName: sandbox-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: sandbox-gateway:local
          imagePullPolicy: Never
          args:
            - serve
            - --database-url-file
            - /run/secrets/database/url
            - --database-ca
            - /run/secrets/database/ca.crt
            - --database-client-certificate
            - /run/secrets/database/tls.crt
            - --database-client-key
            - /run/secrets/database/tls.key
            - --auth-policy
            - /run/secrets/auth/policy.json
            - --worker-auth-policy
            - /run/secrets/auth/worker-policy.json
            - --worker-pool-catalog
            - /run/config/worker-pools/catalog.json
            - --work-order-key
            - /run/secrets/work-order/key
            - --listen
            - 0.0.0.0:8080
            - --allow-non-loopback-http
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: database-identity
              mountPath: /run/secrets/database/url
              subPath: url
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/tls.key
              subPath: tls.key
              readOnly: true
            - name: auth-policy
              mountPath: /run/secrets/auth/policy.json
              subPath: policy.json
              readOnly: true
            - name: auth-policy
              mountPath: /run/secrets/auth/worker-policy.json
              subPath: worker-policy.json
              readOnly: true
            - name: worker-pools
              mountPath: /run/config/worker-pools/catalog.json
              subPath: catalog.json
              readOnly: true
            - name: work-order-key
              mountPath: /run/secrets/work-order/key
              subPath: key
              readOnly: true
      volumes:
        - name: database-identity
          secret:
            secretName: sandbox-gateway-database
            defaultMode: 0440
        - name: auth-policy
          secret:
            secretName: sandbox-gateway-auth
            defaultMode: 0440
        - name: worker-pools
          configMap:
            name: sandbox-worker-pools
            defaultMode: 0440
        - name: work-order-key
          secret:
            secretName: sandbox-work-order
            defaultMode: 0440
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-gateway
  namespace: sandboxd-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-gateway
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-gateway-migrate
  namespace: sandboxd-system
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-gateway-migrate
        app.kubernetes.io/part-of: sandbox-gateway
    spec:
      restartPolicy: Never
      serviceAccountName: sandbox-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: sandbox-gateway:local
          imagePullPolicy: Never
          args:
            - migrate
            - --database-url-file
            - /run/secrets/database/url
            - --database-ca
            - /run/secrets/database/ca.crt
            - --database-client-certificate
            - /run/secrets/database/tls.crt
            - --database-client-key
            - /run/secrets/database/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            - name: database-identity
              mountPath: /run/secrets/database/url
              subPath: url
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/tls.key
              subPath: tls.key
              readOnly: true
      volumes:
        - name: database-identity
          secret:
            secretName: sandbox-gateway-migration-database
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway
  namespace: sandboxd-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-gateway-ingress
  namespace: sandboxd-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              runtrue.io/gateway-clients: "true"
          podSelector:
            matchLabels:
              runtrue.io/gateway-client: "true"
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              runtrue.io/worker-registration-client: "true"
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-gateway-egress
  namespace: sandboxd-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sandbox-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              runtrue.io/placement-database: "true"
          podSelector:
            matchLabels:
              runtrue.io/placement-database: "true"
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              runtrue.io/worker-broker: "true"
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
