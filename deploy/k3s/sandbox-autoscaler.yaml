apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-autoscaler
  namespace: sandboxd-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-autoscaler
  namespace: sandboxd-system
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-autoscaler
  namespace: sandboxd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-autoscaler
subjects:
  - kind: ServiceAccount
    name: sandbox-autoscaler
    namespace: sandboxd-system
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-autoscaler
  namespace: sandboxd-system
spec:
  selector:
    app.kubernetes.io/name: sandbox-autoscaler
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-autoscaler-metrics
  namespace: sandboxd-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-autoscaler
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              runtrue.io/metrics-scraper: "true"
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-autoscaler
  namespace: sandboxd-system
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-autoscaler
    spec:
      serviceAccountName: sandbox-autoscaler
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65531
        runAsGroup: 65531
        fsGroup: 65531
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: autoscaler
          image: sandbox-autoscaler:local
          imagePullPolicy: Never
          args:
            - --database-url-file
            - /run/secrets/database/url
            - --database-ca
            - /run/secrets/database/ca.crt
            - --database-client-certificate
            - /run/secrets/database/tls.crt
            - --database-client-key
            - /run/secrets/database/tls.key
            - --worker-pool-catalog
            - /run/config/worker-pools/catalog.json
            - --namespace
            - sandboxd-system
            - --maximum-total-workers
            - "100"
            - --metrics-listen
            - 0.0.0.0:9090
            - --allow-non-loopback-metrics
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: database-identity
              mountPath: /run/secrets/database/url
              subPath: url
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: database-identity
              mountPath: /run/secrets/database/tls.key
              subPath: tls.key
              readOnly: true
            - name: worker-pools
              mountPath: /run/config/worker-pools/catalog.json
              subPath: catalog.json
              readOnly: true
      volumes:
        - name: database-identity
          secret:
            secretName: sandbox-autoscaler-database
            defaultMode: 0440
        - name: worker-pools
          configMap:
            name: sandbox-worker-pools
            defaultMode: 0440
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-autoscaler
  namespace: sandboxd-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-autoscaler
