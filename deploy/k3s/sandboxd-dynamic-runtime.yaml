apiVersion: v1
kind: Namespace
metadata:
  name: sandboxd-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandboxd
  namespace: sandboxd-system
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxd-default-deny
  namespace: sandboxd-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxd-dynamic-registry-egress
  namespace: sandboxd-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-dynamic-runtime
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-dynamic-runtime
  namespace: sandboxd-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxd-dynamic-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxd-dynamic-runtime
    spec:
      hostUsers: false
      nodeSelector:
        runtrue.io/sandbox-node: "true"
      tolerations:
        - key: runtrue.io/sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
      serviceAccountName: sandboxd
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: Default
      terminationGracePeriodSeconds: 30
      containers:
        - name: sandboxd
          image: sandboxd-dynamic-runtime:local
          imagePullPolicy: Never
          command:
            - /usr/local/bin/run-sandboxd-dynamic-runtime
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
                - SYS_ADMIN
                - SYS_CHROOT
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
              ephemeral-storage: 384Mi
            limits:
              cpu: "3"
              memory: 3Gi
              ephemeral-storage: 8Gi
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/runtrue-sandboxd
                - ping
                - --socket
                - /run/runtrue-sandboxd/control.sock
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/runtrue-sandboxd
                - ping
                - --socket
                - /run/runtrue-sandboxd/control.sock
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/local/bin/runtrue-sandboxd
                  - shutdown
                  - --socket
                  - /run/runtrue-sandboxd/control.sock
          volumeMounts:
            - name: sandboxd-runtime
              mountPath: /run/runtrue-sandboxd
            - name: sandboxd-state
              mountPath: /var/lib/runtrue-sandboxd
            - name: pod-containerd-runtime
              mountPath: /run/containerd
            - name: pod-containerd-state
              mountPath: /var/lib/pod-containerd
            - name: shared-tmp
              mountPath: /tmp
      volumes:
        - name: sandboxd-runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: sandboxd-state
          emptyDir:
            sizeLimit: 4Gi
        - name: pod-containerd-runtime
          emptyDir:
            sizeLimit: 128Mi
        - name: pod-containerd-state
          emptyDir:
            sizeLimit: 4Gi
        - name: shared-tmp
          emptyDir:
            sizeLimit: 512Mi
